name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dashboard and test dependencies
        run: pip install -r 5_communication_strategy/dashboard/dashboard_prototype/requirements.txt pytest
      - name: Run integrity and dashboard smoke tests
        run: pytest -v
